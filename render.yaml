# One-click deploy on Render: https://render.com/deploy
#
# This is a static site, not a web service. It used to be the latter, because
# the game had a matchmaking relay and a world leaderboard to host. Both are
# gone - a Playables build is not allowed to call out - so there is nothing
# left to run: the build produces a single dist/index.html and Render's CDN
# serves it.
#
# That is not just tidier, it matters for certification. A free web service
# spins down after 15 minutes idle and takes the best part of a minute to wake,
# so a reviewer opening a cold link would sit on a blank page. Static sites on
# the free plan have no instance and no spin-down.
services:
  - type: web
    name: steal-the-brainrot
    runtime: static
    buildCommand: node tools/build.mjs
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
