# Steal the Brainrot on Fly.io.
#
#   fly launch --no-deploy          # edit `app` below to a name you own first
#   fly volumes create brainrot_data --size 1
#   fly deploy
#
# The volume is what makes the world leaderboard survive a redeploy. Without a
# mounted DATA_DIR the board is wiped every time you ship.
app = "steal-the-brainrot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

# The world leaderboard lives here. Remove this and it resets on every deploy.
[mounts]
  source = "brainrot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # A suspended machine drops the WebSocket, so keep one alive: players in a
  # match are connected for a full 60s and a cold start mid-queue looks broken.
  min_machines_running = 1

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
