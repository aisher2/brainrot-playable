# Publish the game to GitHub Pages on every push to main.
#
# Pages is a static host, which is now all this game needs: the build produces
# a single self-contained index.html and there is no server left to run.
#
# Render (see render.yaml) is the primary URL; this is a second free one, handy
# as a backup while a submission is in review.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build before checking: the audit inspects the emitted page, so it has
      # nothing to read until dist/ exists. Zero dependencies, so there is no
      # install step.
      - name: Build
        run: node tools/build.mjs

      - name: Verify
        run: |
          node tools/check.mjs
          node tools/mapcheck.mjs
          node tools/solocheck.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
