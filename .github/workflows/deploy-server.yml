# Deploy the game server to Fly.io on every push to main.
#
# WHY THIS EXISTS: GitHub has no product that runs a persistent WebSocket
# server. Pages is static, and Actions runners are short-lived CI jobs with no
# stable public URL. So the server has to live on a host that can hold a socket
# open - but GitHub can still *drive* the deploy, which is what this does:
# push to main, and the live server updates.
#
# ONE-TIME SETUP
#   1. Install flyctl locally and run:  fly auth login
#   2. fly launch --no-deploy           (edit `app` in fly.toml first)
#   3. fly volumes create brainrot_data --size 1
#        ...without a volume the world leaderboard resets on every deploy.
#   4. fly tokens create deploy -x 999999h
#   5. Paste that token into GitHub under
#        Settings -> Secrets and variables -> Actions -> Secrets
#        as FLY_API_TOKEN
#
# Until FLY_API_TOKEN exists this workflow skips instead of failing, so it
# never puts a red X on your commits.

name: Deploy server to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'tools/**'
      - 'index.html'
      - 'styles.css'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is a Fly token configured?
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No FLY_API_TOKEN secret set - skipping the deploy."
            echo "See the header of this file for the one-time setup." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A server that fails its own checks should never replace a working one.
      - name: Verify
        if: steps.guard.outputs.skip != 'true'
        run: |
          node tools/check.mjs
          node tools/mapcheck.mjs
          node tools/servercheck.mjs
          node tools/friendcheck.mjs

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.guard.outputs.skip != 'true'

      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Where it landed
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP=$(grep -m1 '^app *=' fly.toml | cut -d'"' -f2)
          {
            echo "### Server live"
            echo ""
            echo "- Game + relay: https://$APP.fly.dev"
            echo "- Health:       https://$APP.fly.dev/health"
            echo "- Leaderboard:  https://$APP.fly.dev/api/top"
            echo ""
            echo "To give the GitHub Pages build multiplayer, set these repo variables:"
            echo ""
            echo "| Variable | Value |"
            echo "| --- | --- |"
            echo "| \`RELAY_URL\` | \`wss://$APP.fly.dev/ws\` |"
            echo "| \`LEADERBOARD_URL\` | \`https://$APP.fly.dev/api\` |"
          } >> "$GITHUB_STEP_SUMMARY"
